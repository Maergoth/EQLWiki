<!DOCTYPE html>

        text-align: center;
        padding: 60px 20px;
    }
    .box {
        max-width: 600px;
        margin: auto;
        background: #1a1a1a;
        padding: 40px;

        box-shadow: 0 0 20px rgba(0,0,0,0.6);

        font-size: 2rem;
        margin-bottom: 10px;
        color: #ffcc66;
    }
    p {
        font-size: 1.1rem;
        line-height: 1.6;
    }
    a {
        color: #66aaff;
        text-decoration: none;
        font-weight: bold;
    }
    a:hover {
        text-decoration: underline;
    }
</style>

<body>

<div class="box">
    <h1>500 — Internal Server Error</h1>

    <p>

    <p>
        Please try again in a few moments.<br>
        If the issue persists, contact the site administrator.

    <p>
