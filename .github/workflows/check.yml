name: Check EQLWiki changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Lint changed PHP and shell files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD | while IFS= read -r -d '' file; do
            case "$file" in
              *.php) php -l "$file" ;;
              *.sh) bash -n "$file" ;;
            esac
          done
      - name: Check release packaging
        run: |
          python3 ops/test-release-assets.py
          python3 ops/test-incremental-deploy.py
          php ops/test-deployment-assets.php
          python3 ops/build-release.py --output "$RUNNER_TEMP/release.tar.gz"
          tar --list --gzip --absolute-names --quoting-style=escape --file "$RUNNER_TEMP/release.tar.gz" > "$RUNNER_TEMP/release-paths"
          tar --list --verbose --numeric-owner --gzip --absolute-names --quoting-style=escape --file "$RUNNER_TEMP/release.tar.gz" > "$RUNNER_TEMP/release-types"
          php ops/deploy-files.php validate-archive "$RUNNER_TEMP/release-paths" "$RUNNER_TEMP/release-types"
          mkdir "$RUNNER_TEMP/deployment-preflight"
          tar --extract --gzip --file "$RUNNER_TEMP/release.tar.gz" --directory "$RUNNER_TEMP/deployment-preflight" --no-same-owner --same-permissions
          php ops/deploy-files.php validate "$RUNNER_TEMP/deployment-preflight" "$(git rev-parse HEAD)"
      - name: Check Eye of Zomm source export contracts
        run: |
          php ops/test-eoz-exporter.php
          php ops/test-eoz-raid-exporter.php
          php ops/test-eoz-loot-counts.php
      - name: Check shared item formula engine
        run: node ops/test-item-scaling-core.cjs
      - name: Check Main Page and News freshness
        run: php ops/test-homepage-cache.php
      - name: Check public character directory and effect metadata
        run: |
          php ops/test-player-list.php
          php ops/test-character-effects.php
          node ops/build-character-sheet-templates.cjs --check
          node --check skins/EQLImmersive/resources/player-list.js
          node --check skins/EQLImmersive/resources/character-sheet.js
      - name: Check character and item interactions
        run: |
          npm install --prefix "$RUNNER_TEMP/eql-player-dom" --no-save --ignore-scripts --package-lock=false jsdom@27.0.0
          NODE_PATH="$RUNNER_TEMP/eql-player-dom/node_modules" node ops/test-player-list.cjs
          NODE_PATH="$RUNNER_TEMP/eql-player-dom/node_modules" node ops/test-player-list-details.cjs
          NODE_PATH="$RUNNER_TEMP/eql-player-dom/node_modules" node ops/test-character-sheet.cjs
          NODE_PATH="$RUNNER_TEMP/eql-player-dom/node_modules" node ops/test-item-level-slider.cjs
          NODE_PATH="$RUNNER_TEMP/eql-player-dom/node_modules" node ops/test-todo-store.cjs
          NODE_PATH="$RUNNER_TEMP/eql-player-dom/node_modules" node ops/test-todo-ui.cjs
      - name: Check Eye of Zomm refresh wrapper
        run: bash ops/test-eoz-refresh-wrapper.sh
      - name: Check client API and guarded activation contracts
        run: |
          php ops/test-eoz-observations.php
          php ops/test-eoz-installers.php
          php ops/test-hover-item-metadata.php
      - name: Check automatic NPC recorded loot
        run: |
          php ops/test-contribution-coverage.php
          php ops/test-eoz-relationship-coverage.php
          php ops/test-npc-loot-source.php
          php ops/test-npc-loot-lookup.php
          php ops/test-npc-loot-renderer.php
          php ops/test-npc-loot-invalidation.php
          php ops/test-item-drop-lookup.php
