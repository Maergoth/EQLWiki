name: Deploy EQLWiki
on:
  push:
    branches: [main]
    paths-ignore:
      - 'ops/**'
      - 'PROJECT.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eqlwiki-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Package application
        run: python3 ops/build-release.py --output "$RUNNER_TEMP/release.tar.gz"
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.CPANEL_DEPLOY_KEY }}
          HOST_KEYS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eqlwiki_deploy
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
      - name: Deploy and verify live wiki
        run: |
          ssh -i ~/.ssh/eqlwiki_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            eqlwikdq@us2.ableshared.com "deploy $GITHUB_SHA" < "$RUNNER_TEMP/release.tar.gz"
