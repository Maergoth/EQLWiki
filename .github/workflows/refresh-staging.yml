name: Refresh staging data
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eqlwiki-staging
  cancel-in-progress: false
jobs:
  refresh:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure staging SSH
        env:
          DEPLOY_KEY: ${{ secrets.CPANEL_STAGING_DEPLOY_KEY }}
          HOST_KEYS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eqlwiki_deploy
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
      - name: Refresh staging if eligible, or force an explicit manual refresh
        env:
          REFRESH_MODE: ${{ github.event_name == 'schedule' && 'if-stale' || 'force' }}
        run: |
          bash ops/ssh-command.sh "refresh $REFRESH_MODE"
